[project]
name = "payment-cascading-system-test-assignment"
version = "0.1.0"
description = "Payment cascading system demo with Stripe Sandbox"
authors = [
    { name = "Dmitry", email = "dmfaal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.2",
    "redis>=5.0.0",
    "ruff>=0.8.0",
    "taskiq>=0.11.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120

